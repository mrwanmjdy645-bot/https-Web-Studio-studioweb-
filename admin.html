<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة | استديو ويب</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="dashboard">

    <aside class="sidebar"> 

        <h2>استديو ويب</h2>

        <ul>

            <li>🏠 الرئيسية</li>

            <li>📦 المنتجات</li>

            <li>➕ إضافة منتج</li>

            <li>⚙️ الإعدادات</li>

            <li onclick="logout()">🚪 تسجيل الخروج</li>

        </ul>

    </aside>

    <main class="content">

        <h1>لوحة الإدارة</h1>

        <    class="cards">

            <div class="info-card">

                <h2 id="count">0</h2>

                <p>عدد المنتجات</p>

            </div>

        </div>

        <div class="add-product">

<form onsubmit="addProduct(); return false;">

    <input
        type="text"
        id="name"
        placeholder="اسم المنتج"
        required>

    <input
        type="number"
        id="price"
        placeholder="السعر"
        required>

    <textarea
        id="description"
        placeholder="وصف المنتج"
        required></textarea>

    <input
        type="file"
        id="image"
        accept="image/*"
        onchange="previewImage()"
        required>

    <br><br>

    <img
        id="preview"
        src=""
        style="display:none;width:170px;border-radius:10px;">

    <br><br>

    <button type="submit">
        إضافة المنتج
    </button>

</form>

</div>

            <input
                type="text"
                id="name"
                placeholder="اسم المنتج">

            <input
                type="number"
                id="price"
                placeholder="السعر">

            <textarea
                id="description"
                placeholder="وصف المنتج"></textarea>

            <input
                type="file"
                id="image"
                accept="image/*"
                onchange="previewImage()">

            <br><br>

            <img
                id="preview"
                src=""
                style="display:none;width:170px;border-radius:10px;">

            <br><br>

            <button onclick="addProduct()">

                إضافة المنتج

            </button>

        </div>

        <br>

        <input

            type="text"

            id="search"

            placeholder="🔍 ابحث عن منتج..."

            onkeyup="searchProducts()">

        <div id="products"></div>

    </main>

</div>

<script src="js/admin.js"></script>

</body>

</html>
